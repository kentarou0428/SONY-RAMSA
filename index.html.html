<!DOCTYPE html>
<html lang="ja" style="background:#d3d4d9">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#d3d4d9">
<title>1.2GHz帯 SONY ↔︎ RAMSA変換</title>
<style>
:root{
  --bg:#d3d4d9; --foot:#383c47; --card:#f3f4f6; --ink:#16181e; --mute:#4f5460;
  --navy:#233985; --on-navy:#ffffff; --blue:#233985;
  --field:#e8e9ed; --line:#aeb0b8; --btn:#e0e2e7;
  --btn-bg:#f0f1f4; --btn-ink:#16181e; --btn-line:#a7a9b1;
  --info-bg:#e3e7f7; --info-line:#a9b4e6; --info-ink:#1f3080;
  --warn:#a42a1c; --th:#dcdee4; --stripe:#e9eaee; --rule:#bfc1c9;
  --box:#fafafb; --red:#b5311f; --seg1:#e9eaee; --seg2:#dcdee6; --seg3:#cfd2dd;
  --shadow:0 1px 3px rgba(20,22,40,.28);
  --card-shadow:0 1px 6px rgba(20,22,40,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%; min-height:100%}
html{overflow-x:hidden; background:#d3d4d9 !important; min-height:100%; overscroll-behavior:none}
body{
  margin:0; background:#d3d4d9 !important; color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  line-height:1.3;
}
/* 1画面に収める: 画面の高さいっぱいを使い、表だけ内側でスクロール */
.app{
  max-width:520px; margin:0 auto; height:100vh; height:100dvh; background:var(--bg);
  padding:max(8px,env(safe-area-inset-top)) 12px max(6px,env(safe-area-inset-bottom));
  display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden;
}
h1{
  margin:12px 0 1.25em; text-align:center; font-weight:800;
  font-size:clamp(16px,calc((100vw - 24px)/17.4),25px); line-height:1.25; flex:none; white-space:nowrap;
}
@font-face{font-family:"SRArrow"; src:url(data:font/woff;base64,d09GRgABAAAAAAKcAAoAAAAAAsQAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAABPUy8yAAABZAAAADAAAABgJXY3MGNtYXAAAAGgAAAALQAAADQADOBUZ2x5ZgAAAdgAAABUAAAAXGXQ5EhoZWFkAAAA9AAAADYAAAA2NTEKZmhoZWEAAAEsAAAAIAAAACQLWgfYaG10eAAAAZQAAAAMAAAADBAkAfRsb2NhAAAB0AAAAAgAAAAIABoALm1heHAAAAFMAAAAGAAAACAABQAMbmFtZQAAAiwAAABPAAAAYDFYl6xwb3N0AAACfAAAAB0AAAA2T4MX6gABAAAAAQAA650cT18PPPUAAwPoAAAAAOci41sAAAAA5yLjWwD6/8EG2gMPAAAAAwACAAAAAAAAeJxjYGRgYG75z8bAwH6F4RfDL7ZbDEARFMAMAIBPBUF4nGNgZGBgYGbgYgDRDAxMDGgAAAHDABJ4nGNgZk1knMDAysDCQAQQQGLbAwEDwwOGB4zMLf/ZGBiYWxh+oSlXYGAAAAFvBv4B9AAAB9QA+gZcAPp4nGNgYGBiYGBgBmIRIMkIplkYFIA0CxAC+Q8Y//8Hkgz//yswguUZAFmbBj4AAAAAAAAAABoALnicY2Bk+PX/INstZn4GTgYGYUZBRUFGEPGL8RqTCeO1f1p/zzBmMC7/95eR+V/kv0gg+ZeBAayHNQmohw2oB6LjF1MyE+vf33/nMvHAlAIAJPUdTnicJYjBCcAgEARHI0g+qSB15G8LZwU+xI8gHIjt50xmYBkWCDw4No747cZbRw5cOO25zL+91Z0lqY4ltc1elIyQUHOwrCuNSaegLz2CC8QAeJxjYGLAD5gZGBiZGJnZEouK8suNIJQhACPCBNIAAAA=) format("woff"); font-weight:400; font-style:normal}
.af{font-family:"SRArrow",sans-serif; font-weight:400; font-style:normal; letter-spacing:0}
.t-arr{color:var(--mute)}
.t-sony{color:var(--red)} .t-ramsa{color:var(--blue)}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue); outline-offset:1px}

.modes{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-bottom:8px; flex:none; width:100%}
.mode{
  min-height:66px; padding:4px 6px; border:1px solid var(--btn-line); border-radius:16px;
  background:var(--btn-bg); color:var(--btn-ink); box-shadow:var(--shadow);
  font-weight:800; font-size:clamp(13px,4.3vw,19px); white-space:nowrap; min-width:0; overflow:hidden;
}
.mode[aria-pressed="true"]{background:var(--navy); color:var(--on-navy)}

.card{
  background:var(--card); border-radius:18px; padding:10px 14px 12px;
  box-shadow:var(--card-shadow); margin-bottom:8px; flex:none;
}
.card.tbl{flex:none}
.lbl{margin:0 0 4px; font-weight:800; font-size:13px; color:var(--mute)}
.block{margin-bottom:8px}
.block:last-child{margin-bottom:0}

.chips{display:grid; gap:6px}
.chips.cols3{grid-template-columns:repeat(3,1fr)}
.chips.cols4{grid-template-columns:repeat(4,1fr)}
.chips.cols5{grid-template-columns:repeat(5,1fr)}
#rg-groups .chip{font-weight:400}
.chip{
  width:100%; min-width:0; aspect-ratio:2/1; padding:0; border:1px solid var(--btn-line); border-radius:10px;
  background:var(--btn-bg); color:var(--btn-ink); box-shadow:var(--shadow);
  font-weight:800; font-size:clamp(14px,4.2vw,18px); white-space:nowrap;
}
.chip:active,.chip[aria-pressed="true"]{background:#2b6ff0; color:#ffffff; border-color:#1d57c9}
.row{display:grid; grid-template-columns:46px 46px minmax(0,1fr); grid-template-rows:auto auto; gap:6px; align-items:center}
.row .field{grid-column:3; grid-row:1}
.row input[type=range]{grid-column:3; grid-row:2; margin:0}
.row .stepper{grid-row:1 / span 2; align-self:stretch}
.field{
  width:100%; min-width:0; height:46px; border:2px solid var(--line); border-radius:12px;
  background:var(--field); color:var(--ink); text-align:center;
  font-family:inherit; font-weight:800; font-size:26px; line-height:1; letter-spacing:.05em;
  font-variant-numeric:tabular-nums;
}
.field::placeholder{color:var(--mute); opacity:.85}
@media (max-width:370px){.field::placeholder{font-size:.78em; letter-spacing:.02em}}
.stepper{
  border:1px solid var(--btn-line); border-radius:12px; background:var(--btn-bg); color:var(--btn-ink);
  box-shadow:var(--shadow); font-size:26px; font-weight:800; line-height:1; padding:0;
}
.stepper:active{transform:translateY(1px)}

input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:26px; margin:4px 0 0;
  background:transparent; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:8px; border-radius:5px; background:var(--line)}
input[type=range]::-moz-range-track{height:8px; border-radius:5px; background:var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:24px; height:24px; margin-top:-8px; border-radius:50%;
  background:var(--navy); border:3px solid var(--card); box-shadow:0 1px 4px rgba(0,0,0,.4);
}
input[type=range]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%;
  background:var(--navy); border:3px solid var(--card); box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.help{margin:4px 0 0; font-size:12px; color:var(--mute)}

.msg{
  margin:0; padding:10px 14px; border-radius:12px;
  background:var(--info-bg); border:2px solid var(--info-line); color:var(--info-ink);
  font-weight:800; font-size:clamp(12px,3.6vw,16px);
}
.msg.err{color:var(--warn); border-color:var(--warn)}
.note{
  margin:8px 0 0; padding:6px 10px; border-radius:10px; background:var(--field); text-align:center;
  font-size:12px; color:var(--ink);
}

.fq-big{text-align:center; font-weight:800; font-size:clamp(28px,8.4vw,38px); line-height:1.1; letter-spacing:.02em; font-variant-numeric:tabular-nums}
.fq-big small{font-size:.42em; color:var(--mute); margin-left:6px; letter-spacing:0}
.bar{position:relative; display:flex; height:24px; margin-top:6px; border:2px solid var(--rule); border-radius:8px; overflow:hidden}
.bar span{display:block; text-align:center; font-weight:700; font-size:13px; line-height:20px; color:var(--mute)}
.bar span:nth-child(1){flex:30; background:var(--seg1)}
.bar span:nth-child(2){flex:30; background:var(--seg2); border-left:1px solid var(--rule)}
.bar span:nth-child(3){flex:40; background:var(--seg3); border-left:1px solid var(--rule)}
.bar i{position:absolute; top:0; bottom:0; width:4px; margin-left:-2px; background:var(--red)}
.ticks{position:relative; height:16px; margin-top:3px; font-size:12px; color:var(--mute)}
.ticks span{position:absolute; top:0; white-space:nowrap; font-variant-numeric:tabular-nums}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
.box{text-align:center; border:3px solid; border-radius:14px; padding:6px 10px 8px; background:var(--box); min-width:0}
.box.sony{border-color:var(--red)} .box.ramsa{border-color:var(--blue)}
.box-t{font-weight:800; font-size:clamp(18px,5.4vw,22px); line-height:1.2}
.sony .box-t{color:var(--red)} .ramsa .box-t{color:var(--blue)}
.box-s{font-size:clamp(10px,3vw,12px); white-space:nowrap; color:var(--mute)}
.box-v{font-weight:800; font-size:clamp(20px,6.2vw,28px); line-height:1.2; white-space:nowrap; font-variant-numeric:tabular-nums}
.sony .box-v{color:var(--red)} .ramsa .box-v{color:var(--blue)}
.box-v.none{color:var(--warn); font-size:clamp(16px,5vw,20px); white-space:normal}
.gtags{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin-top:4px}
.gtag{background:var(--btn); border-radius:999px; padding:1px 10px; font-weight:800; font-size:14px}

.tbl-title{margin:8px 0 6px; font-size:clamp(14px,4vw,16px); font-weight:700; color:var(--mute); flex:none}
.tbl-wrap{border:2px solid var(--rule); border-radius:12px; overflow:clip}
table{width:100%; border-collapse:separate; border-spacing:0; text-align:center; font-variant-numeric:tabular-nums}
th{position:sticky; top:0; z-index:1; background:var(--th); font-weight:800; font-size:14px; padding:6px 4px}
td{padding:0 4px; height:34px; font-size:14px; border-top:1px solid var(--rule)}
tbody tr:nth-child(odd) td{background:var(--stripe)}
td.name{font-weight:800; font-size:16px}
td.none{color:var(--warn); font-weight:800; font-size:12px; line-height:1.2}
.tag{display:block; font-size:10px; font-weight:700; color:var(--mute); line-height:1.1}

.foot{margin:2px 2px 0; font-size:11px; line-height:1.35; color:var(--foot); flex:none}
[hidden]{display:none !important}
@media (max-height:700px){
  h1{font-size:clamp(16px,calc((100vw - 24px)/18),24px); margin:10px 0 1.25em}
  .modes{gap:5px; margin-bottom:6px}
  .mode{min-height:50px}
  .help{display:none}
  .card{margin-bottom:6px; padding:8px 12px 10px}
  .field{height:38px; font-size:22px}
  .stepper{font-size:22px}
  .row{grid-template-columns:38px 38px 1fr}
  .block{margin-bottom:6px}
  .fq-big{font-size:clamp(24px,7vw,30px)}
  .box{padding:4px 10px 6px}
  .ticks{margin-top:2px}
  .foot{font-size:10px; line-height:1.3}
}
@media (max-height:660px){
  .mode{min-height:48px}
  .help{display:none}
  .card{padding:6px 12px 8px}
  .block{margin-bottom:4px}
}
@media (max-height:640px){
  h1{margin-bottom:.8em}
  .mode{min-height:34px}
  .field{height:36px; font-size:20px}
  .stepper{font-size:20px}
  .row{grid-template-columns:36px 36px 1fr}
  .card{padding:6px 10px 8px; margin-bottom:6px}
  .fq-big{font-size:24px}
  .note{margin-top:5px; padding:4px 8px; font-size:11px}
  .box{padding:4px 8px 6px}
  .foot{font-size:10px}
}
</style>
</head>
<body style="background:#d3d4d9">
<main class="app">
  <h1 aria-label="1.2GHz帯 SONYとRAMSAの変換">1.2GHz帯 <span class="t-sony">SONY</span><span class="t-arr af" aria-hidden="true">&#xE000;</span><span class="t-ramsa">RAMSA</span>変換</h1>

  <div class="modes" id="modes">
    <button class="mode" data-mode="s2r" type="button"  aria-label="SONYからRAMSA">SONY<span class="af" aria-hidden="true">&#xE001;</span>RAMSA</button>
    <button class="mode" data-mode="r2s" type="button"  aria-label="RAMSAからSONY">RAMSA<span class="af" aria-hidden="true">&#xE001;</span>SONY</button>
    <button class="mode" data-mode="sg" type="button">SONYグループ表</button>
    <button class="mode" data-mode="rg" type="button">RAMSAグループ表</button>
    <button class="mode" data-mode="fq" type="button">周波数から検索</button>
  </div>

  <!-- SONY → RAMSA -->
  <section class="card" id="p-s2r" hidden>
    <div class="block">
      <p class="lbl">バンド</p>
      <div class="chips cols4" id="s2r-bands"></div>
    </div>
    <div class="block">
      <label class="lbl" for="s2r-ch" id="s2r-ch-lbl">SONYチャンネル（3桁）</label>
      <div class="row">
        <button class="stepper" type="button" data-for="s2r-ch" data-d="-1" aria-label="チャンネルを1つ下げる">−</button>
        <button class="stepper" type="button" data-for="s2r-ch" data-d="1" aria-label="チャンネルを1つ上げる">+</button>
        <input class="field" id="s2r-ch" inputmode="numeric" autocomplete="off" placeholder="例: 010" aria-describedby="s2r-help">
        <input type="range" id="s2r-rng" min="10" max="240" step="10" value="10" aria-label="SONYチャンネル">
      </div>
      <p class="help" id="s2r-help">「1.2L-025」のように貼り付けても読み取ります。</p>
    </div>
  </section>

  <!-- RAMSA → SONY -->
  <section class="card" id="p-r2s" hidden>
    <div class="block">
      <label class="lbl" for="r2s-g">RAMSAグループ（01〜20）</label>
      <div class="row">
        <button class="stepper" type="button" data-for="r2s-g" data-d="-1" aria-label="グループを1つ下げる">−</button>
        <button class="stepper" type="button" data-for="r2s-g" data-d="1" aria-label="グループを1つ上げる">+</button>
        <input class="field" id="r2s-g" inputmode="numeric" autocomplete="off" placeholder="例: 05">
        <input type="range" id="r2s-grng" min="1" max="20" step="1" value="1" aria-label="RAMSAグループ">
      </div>
    </div>
    <div class="block">
      <label class="lbl" for="r2s-c">チャンネル（01〜）</label>
      <div class="row">
        <button class="stepper" type="button" data-for="r2s-c" data-d="-1" aria-label="チャンネルを1つ下げる">−</button>
        <button class="stepper" type="button" data-for="r2s-c" data-d="1" aria-label="チャンネルを1つ上げる">+</button>
        <input class="field" id="r2s-c" inputmode="numeric" autocomplete="off" placeholder="例: 03">
        <input type="range" id="r2s-crng" min="1" max="37" step="1" value="1" aria-label="RAMSAチャンネル">
      </div>
      <p class="help">「05-03」のように貼り付けても読み取ります。入力すると自動で検索します。</p>
    </div>
  </section>

  <!-- SONYグループ表 -->
  <section class="card tbl" id="p-sg" hidden>
    <div class="block">
      <p class="lbl">バンド</p>
      <div class="chips cols4" id="sg-bands"></div>
    </div>
    <div class="block">
      <p class="lbl">グループ</p>
      <div class="chips cols4" id="sg-groups"></div>
    </div>
    <h2 class="tbl-title" id="sg-title"></h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>No</th><th>SONY</th><th>MHz</th><th>RAMSA</th></tr></thead>
      <tbody id="sg-body"></tbody>
    </table></div>
  </section>

  <!-- RAMSAグループ表 -->
  <section class="card tbl" id="p-rg" hidden>
    <div class="block">
      <p class="lbl">グループ</p>
      <div class="chips cols5" id="rg-groups"></div>
    </div>
    <h2 class="tbl-title" id="rg-title"></h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>No</th><th>RAMSA</th><th>MHz</th><th>SONY</th></tr></thead>
      <tbody id="rg-body"></tbody>
    </table></div>
  </section>

  <!-- 周波数から検索 -->
  <section class="card" id="p-fq" hidden>
    <div class="block">
      <label class="lbl" for="fq-f">周波数 [MHz]</label>
      <div class="row">
        <button class="stepper" type="button" data-for="fq-f" data-d="-1" aria-label="周波数を25kHz下げる">−</button>
        <button class="stepper" type="button" data-for="fq-f" data-d="1" aria-label="周波数を25kHz上げる">+</button>
        <input class="field" id="fq-f" inputmode="decimal" autocomplete="off" placeholder="例: 1240.250">
        <input type="range" id="fq-rng" min="1240000" max="1260000" step="25" value="1240000" aria-label="周波数">
      </div>
      <p class="help">1240.000〜1260.000 MHz。小数点以下3桁まで入力すると検索します。</p>
    </div>
  </section>

  <!-- 結果 -->
  <section class="card" id="result-card" hidden>
    <div id="result" aria-live="polite"></div>
  </section>

  <p class="foot">データはアップロードされたSONY・RAMSAの1.2GHz帯周波数表を元にしています。本番前に必ず実機の表示・周波数表と照合してください。</p>
</main>

// SONY: 周波数[kHz] = BASE + ch * 25
const BASE = {L:1240000, M:1246000, H:1253000};
const RANGE = {L:[1,240], M:[1,239], H:[1,279]};
// 周波数表でグレー表示（デジタルワイヤレスでは使用不可）のチャンネル
const isGrey = (b,n) => (b==='L'&&n<=5) || (b==='M'&&n>=234) || (b==='H'&&(n<=6||n>=275));

const rng = (a,z,s) => { const r=[]; for(let n=a;n<=z;n+=s) r.push(n); return r; };
const SONY_GROUPS = {
  L:[["L-01",rng(5,225,20)],["L-02",rng(15,215,20)],["L-03",rng(10,230,20)],["L-04",rng(20,220,20)]],
  M:[["M-01",rng(10,230,20)],["M-02",rng(20,220,20)],["M-03",rng(15,215,20)],["M-04",rng(25,225,20)]],
  H:[["H-01",rng(10,270,20)],["H-02",rng(20,260,20)],["H-03",rng(15,275,20)],["H-04",rng(25,265,20)]]
};

/* ===== 変換ロジック ===== */
const pad = (n,w) => String(n).padStart(w,'0');
const sonyName = (b,n) => `1.2${b}-${pad(n,3)}`;
const freqOf = (b,n) => BASE[b] + n*25;
const fmt = k => (k/1000).toFixed(3);

function sonyFromFreq(k){
  for (const b of ['L','M','H']){
    const d = k - BASE[b];
    if (d % 25 === 0){
      const n = d/25;
      if (n >= RANGE[b][0] && n <= RANGE[b][1]) return {b, n};
    }
  }
  return null;
}
const ramsaFromFreq = k => RAMSA[k] || null;

// RAMSA グループごとのチャンネル→周波数
const RF = {}; const GCOUNT = {};
for (const [k,v] of Object.entries(RAMSA)){
  const [g,c] = v.split('-').map(Number);
  (RF[g] = RF[g] || {})[c] = Number(k);
  GCOUNT[g] = Math.max(GCOUNT[g]||0, c);
}
const MAX_CH = Math.max(...Object.values(GCOUNT));

function groupLabel(chs){
  const gaps = chs.slice(1).map((n,i)=> (n-chs[i])*25);
  const min = Math.min(...gaps);
  const same = gaps.every(x=>x===min);
  return `${same ? min+'kHz間隔' : '最小間隔 '+min+'kHz'} / ${chs.length}ch`;
}

/* ===== 画面 ===== */
const $ = s => document.querySelector(s);
const state = {mode:'s2r', band:'L', sgBand:'L', sgGroup:'L-03', rgGroup:1};

function chipButtons(box, items, current, onPick){
  box.innerHTML = '';
  for (const it of items){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.textContent = it.label;
    b.setAttribute('aria-pressed', String(it.value === current));
    b.addEventListener('click', () => onPick(it.value));
    box.appendChild(b);
  }
}

function showResult(html, hasCard=true){
  $('#result-card').hidden = !hasCard;
  $('#result').innerHTML = html;
}
const msg = (t, err=false) => `<p class="msg${err?' err':''}">${t}</p>`;
function resBlock(label, main, subs, none=false){
  return `<div class="res"><div class="res-label">${label}</div>` +
    `<div class="res-main${none?' none':''}">${main}</div>` +
    subs.map(s=>`<div class="res-sub">${s}</div>`).join('') + `</div>`;
}

function foundHTML(k){
  const s = sonyFromFreq(k), r = ramsaFromFreq(k);
  const pos = ((k-1240000)/20000*100).toFixed(2);
  const tags = s ? SONY_GROUPS[s.b].filter(g=>g[1].includes(s.n)).map(g=>`<span class="gtag">${g[0]}</span>`).join('') : '';
  return `<div class="fq-big">${fmt(k)}<small>MHz</small></div>` +
    `<div class="bar"><span>1.2L</span><span>1.2M</span><span>1.2H</span><i style="left:${pos}%"></i></div>` +
    `<div class="ticks"><span style="left:0">1240</span><span style="left:30%;transform:translateX(-50%)">1246</span>` +
    `<span style="left:60%;transform:translateX(-50%)">1252</span><span style="right:0">1260 MHz</span></div>` +
    `<div class="pair">` +
    `<div class="box sony"><div class="box-t">SONY</div>` +
      (s ? `<div class="box-v">${sonyName(s.b,s.n)}</div>${tags?`<div class="gtags">${tags}</div>`:''}`
         : `<div class="box-v none">割当なし</div>`) + `</div>` +
    `<div class="box ramsa"><div class="box-t">RAMSA</div><div class="box-s">グループ/チャンネル</div>` +
      (r ? `<div class="box-v">${r}</div>` : `<div class="box-v none">割当なし</div>`) + `</div>` +
    `</div>`;
}
function setMode(m){
  state.mode = m;
  document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode===m)));
  for (const id of ['s2r','r2s','sg','rg','fq']) $('#p-'+id).hidden = (id!==m);
  render();
}

function render(){
  ({s2r:renderS2R, r2s:renderR2S, sg:renderSG, rg:renderRG, fq:renderFQ})[state.mode]();
}

/* --- SONY → RAMSA --- */
function renderS2R(){
  chipButtons($('#s2r-bands'), ['L','M','H'].map(b=>({label:'1.2'+b, value:b})), state.band, b=>{
    state.band = b; renderS2R();
  });
  const [lo,hi] = RANGE[state.band];
  const rg = $('#s2r-rng'); rg.min = 10; rg.max = Math.floor(hi/10)*10; rg.step = 10;
  const raw = $('#s2r-ch').value;
  const n = parseInt(raw,10);
  rg.value = isNaN(n) ? 10 : Math.min(Number(rg.max), Math.max(10, Math.round(n/10)*10));
  if (raw === '') return showResult(msg('チャンネルを入力してください。'));
  if (isNaN(n) || n < lo || n > hi)
    return showResult(msg(`1.2${state.band} のチャンネルは ${pad(lo,3)}〜${pad(hi,3)} です。`, true));
  const b = state.band, k = freqOf(b,n);
  showResult(foundHTML(k));
}

/* --- RAMSA → SONY --- */
function renderR2S(){
  const gRaw = $('#r2s-g').value, cRaw = $('#r2s-c').value;
  const g = parseInt(gRaw,10), c = parseInt(cRaw,10);
  const gOk = !isNaN(g) && g>=1 && g<=20;
  const max = gOk ? GCOUNT[g] : MAX_CH;
  const crg = $('#r2s-crng'); crg.max = max;
  $('#r2s-grng').value = gOk ? g : 1;
  crg.value = isNaN(c) ? 1 : Math.min(max, Math.max(1, c));
  if (gRaw==='' && cRaw==='') return showResult(msg('グループとチャンネルを入力してください。'));
  if (gRaw==='' || cRaw==='') return showResult(msg(gRaw==='' ? 'グループを入力してください。' : 'チャンネルを入力してください。'));
  if (!gOk) return showResult(msg('グループは 01〜20 です。', true));
  if (isNaN(c) || c<1 || c>max) return showResult(msg(`グループ ${pad(g,2)} のチャンネルは 01〜${pad(max,2)} です。`, true));
  const k = RF[g][c], s = sonyFromFreq(k);
  showResult(foundHTML(k));
}

/* --- SONYグループ表 --- */
function renderSG(){
  chipButtons($('#sg-bands'), ['L','M','H'].map(b=>({label:'1.2'+b, value:b})), state.sgBand, b=>{
    state.sgBand = b; state.sgGroup = SONY_GROUPS[b][0][0]; renderSG();
  });
  const groups = SONY_GROUPS[state.sgBand];
  if (!groups.some(g=>g[0]===state.sgGroup)) state.sgGroup = groups[0][0];
  chipButtons($('#sg-groups'), groups.map(g=>({label:g[0], value:g[0]})), state.sgGroup, v=>{
    state.sgGroup = v; renderSG();
  });
  const [name, chs] = groups.find(g=>g[0]===state.sgGroup);
  $('#sg-title').textContent = `1.2${state.sgBand} ${name} ${groupLabel(chs)}`;
  $('#sg-body').innerHTML = chs.map((n,i)=>{
    const k = freqOf(state.sgBand,n), r = ramsaFromFreq(k);
    const grey = isGrey(state.sgBand,n);
    return `<tr><td>${i+1}</td>` +
      `<td class="name">${sonyName(state.sgBand,n)}${grey?'<span class="tag">デジタル使用不可</span>':''}</td>` +
      `<td>${fmt(k)}</td>` +
      (r ? `<td class="name">${r}</td>` : `<td class="none">RAMSA割当<br>なし</td>`) + `</tr>`;
  }).join('');
  showResult('', false);
}

/* --- RAMSAグループ表 --- */
function renderRG(){
  chipButtons($('#rg-groups'), rng(1,20,1).map(g=>({label:pad(g,2), value:g})), state.rgGroup, v=>{
    state.rgGroup = v; renderRG();
  });
  const g = state.rgGroup, n = GCOUNT[g];
  $('#rg-title').textContent = `グループ ${pad(g,2)} ／ ${n}ch`;
  let html = '';
  for (let c=1;c<=n;c++){
    const k = RF[g][c], s = sonyFromFreq(k);
    html += `<tr><td>${c}</td><td class="name">${pad(g,2)}-${pad(c,2)}</td><td>${fmt(k)}</td>` +
      (s ? `<td class="name">${sonyName(s.b,s.n)}</td>` : `<td class="none">SONY割当<br>なし</td>`) + `</tr>`;
  }
  $('#rg-body').innerHTML = html;
  showResult('', false);
}

/* --- 周波数から検索 --- */
function renderFQ(){
  const raw = $('#fq-f').value.trim();
  const v = parseFloat(raw);
  $('#fq-rng').value = isNaN(v) ? 1240000 : Math.min(1260000, Math.max(1240000, Math.round(v*1000)));
  if (raw === '') return showResult(msg('周波数を入力してください。'));
  if (!/^\d{4}\.\d{3}$/.test(raw)) return showResult(msg('小数点以下3桁まで入力してください。（例: 1240.250）'));
  const k = Math.round(v*1000);
  if (k < 1240000 || k > 1260000) return showResult(msg('1240.000〜1260.000 MHz の範囲で入力してください。', true));
  if (k % 25 !== 0) return showResult(msg('25kHz刻みの周波数を入力してください。（例: 1240.250）', true));
  const s = sonyFromFreq(k);
  showResult(foundHTML(k));
}

/* ===== 入力まわり ===== */
const digits = (s,len) => s.replace(/\D/g,'').slice(0,len);
const PAIR = /^\s*(\d{1,2})\s*[-－ー–—\/／・.]\s*(\d{1,2})\s*$/;
const SONYPASTE = /1\.?2\s*([LMHlmh])\s*[-－ー–—\s]?\s*(\d{1,3})/;

$('#s2r-ch').addEventListener('input', e => {
  const m = e.target.value.match(SONYPASTE);
  if (m){ state.band = m[1].toUpperCase(); e.target.value = pad(parseInt(m[2],10),3); }
  else e.target.value = digits(e.target.value,3);
  renderS2R();
});
$('#s2r-rng').addEventListener('input', e => { $('#s2r-ch').value = pad(e.target.value,3); renderS2R(); });

function r2sInput(e){
  const m = e.target.value.match(PAIR);
  if (m){ $('#r2s-g').value = pad(parseInt(m[1],10),2); $('#r2s-c').value = pad(parseInt(m[2],10),2); }
  else e.target.value = digits(e.target.value,2);
  renderR2S();
}
$('#r2s-g').addEventListener('input', r2sInput);
$('#r2s-c').addEventListener('input', r2sInput);
$('#r2s-grng').addEventListener('input', e => { $('#r2s-g').value = pad(e.target.value,2); renderR2S(); });
$('#r2s-crng').addEventListener('input', e => { $('#r2s-c').value = pad(e.target.value,2); renderR2S(); });

$('#fq-f').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1').slice(0,9);
  renderFQ();
});
$('#fq-rng').addEventListener('input', e => { $('#fq-f').value = fmt(Number(e.target.value)); renderFQ(); });

// −／＋ ボタン
document.querySelectorAll('.stepper').forEach(btn => btn.addEventListener('click', () => {
  const id = btn.dataset.for, d = Number(btn.dataset.d);
  const el = document.getElementById(id);
  if (id === 's2r-ch'){
    const [lo,hi] = RANGE[state.band], n = parseInt(el.value,10);
    el.value = pad(isNaN(n) ? lo : Math.min(hi, Math.max(lo, n+d)), 3); renderS2R();
  } else if (id === 'r2s-g'){
    const n = parseInt(el.value,10);
    el.value = pad(isNaN(n) ? 1 : Math.min(20, Math.max(1, n+d)), 2); renderR2S();
  } else if (id === 'r2s-c'){
    const g = parseInt($('#r2s-g').value,10), max = (g>=1&&g<=20) ? GCOUNT[g] : MAX_CH;
    const n = parseInt(el.value,10);
    el.value = pad(isNaN(n) ? 1 : Math.min(max, Math.max(1, n+d)), 2); renderR2S();
  } else if (id === 'fq-f'){
    const v = parseFloat(el.value);
    const k = isNaN(v) ? 1240000 : Math.round(v*1000);
    const next = Math.min(1260000, Math.max(1240000, (Math.round(k/25)+ (isNaN(v)?0:d))*25));
    el.value = fmt(next); renderFQ();
  }
}));

document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

setMode('s2r');
</script>
</body>
</html>
